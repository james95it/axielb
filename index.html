<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axie Bounty Board Monitor (Realtime DB Sync)</title>
    <!-- Tích hợp Firebase SDK bản Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --block-bg: #111827;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Styles cho Màn hình Đăng nhập */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }
        .login-box {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-box h2 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .login-box p {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .login-box input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: var(--block-bg);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-box input:focus {
            border-color: var(--accent);
        }
        .login-box button {
            width: 100%;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .login-box button:hover {
            background-color: var(--accent-hover);
        }
        .login-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* Styles cho Dashboard */
        .dashboard {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1100px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { margin: 0; color: var(--accent); font-size: 1.8rem; }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }

        .refresh-btn, .logout-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .refresh-btn {
            background-color: var(--accent);
            color: #0f172a;
        }
        .refresh-btn:hover { background-color: var(--accent-hover); }
        
        .logout-btn {
            background-color: #334155;
            color: var(--text-main);
        }
        .logout-btn:hover { background-color: #475569; }

        .status-text { text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-bottom: 1rem; }
        
        .warning-banner {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .accounts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
        .account-block { background-color: var(--block-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; transition: all 0.3s ease; }
        
        .account-block.lazy-alert {
            border-color: var(--danger);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
            background-color: #1a131b;
        }

        .account-title { font-size: 1.3rem; font-weight: bold; color: var(--accent); margin-bottom: 2px; }
        .account-wallet { font-family: monospace; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 1.5rem; word-break: break-all; }
        
        .stats-subgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .card { background-color: #243147; padding: 1rem; border-radius: 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .card.highlight { border: 1px solid var(--accent); background-color: rgba(56, 189, 248, 0.03); }
        .card h3 { margin: 0 0 0.4rem 0; color: var(--text-sub); font-size: 0.8rem; text-transform: uppercase; }
        .value { font-size: 1.4rem; font-weight: bold; }
        
        .diff-container { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; align-items: center; border-top: 1px solid #334155; padding-top: 6px; }
        .diff-line { font-size: 0.75rem; font-weight: 500; }

        .loading { text-align: center; color: var(--accent); font-size: 1.2rem; padding: 2rem; }
        .error { text-align: center; color: var(--danger); font-size: 1.2rem; padding: 1rem; }

        @media (max-width: 640px) {
            .stats-subgrid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- MÀN HÌNH ĐĂNG NHẬP -->
<div id="login-overlay" class="login-overlay">
    <div class="login-box">
        <h2>🔒 Khóa Bảo Vệ Firebase</h2>
        <p>Xác thực qua Firebase Realtime Database</p>
        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="password" id="password-input" placeholder="Nhập mật khẩu truy cập..." required autofocus />
            <button type="submit" id="login-btn">Đăng nhập</button>
        </form>
        <div id="login-error" class="login-error">❌ Mật khẩu không chính xác!</div>
    </div>
</div>

<!-- DASHBOARD CHÍNH (MẶC ĐỊNH ẨN) -->
<div class="dashboard" id="main-dashboard" style="display: none;">
    <div class="header">
        <h1>Giám Sát Điểm Axie Bounty (Realtime DB Sync)</h1>
        <div class="header-actions">
            <button id="refresh-btn" class="refresh-btn">🔄 Làm mới</button>
            <button id="logout-btn" class="logout-btn" onclick="handleLogout()">🔒 Đăng xuất</button>
        </div>
    </div>

    <div id="update-status" class="status-text">Đang khởi tạo...</div>
    
    <!-- Vùng thông báo ví chưa cày điểm -->
    <div id="warning-banner" class="warning-banner" style="display: none;"></div>

    <div id="loading-state" class="loading">🔄 Đang tải dữ liệu thực tế...</div>
    <div id="error-state" class="error" style="display: none;">⚠️ Không thể lấy dữ liệu từ Axie API.</div>

    <div class="accounts-grid" id="accounts-container"></div>
</div>

<script>
    // ===================================================
    // 1. CẤU HÌNH FIREBASE
    // ===================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDoAeayAY4AiEJkJuupkuAj72awemwk-Bo",
        authDomain: "axielb-17704.firebaseapp.com",
        databaseURL: "https://axielb-17704-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "axielb-17704",
        storageBucket: "axielb-17704.firebasestorage.app",
        messagingSenderId: "901526066892",
        appId: "1:901526066892:web:7257fb8a98ef1c6da0d469",
        measurementId: "G-ZYVQLKT9XE"
    };

    let db = null;
    try {
        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }
    } catch (e) {
        console.error("Lỗi cấu hình Firebase khởi tạo:", e);
    }

    // ===================================================
    // 2. XÁC THỰC MẬT KHẨU BẰNG FIREBASE (KHÔNG DÙNG LOCALSTORAGE)
    // ===================================================
    let isAuthenticated = false;

    async function handleLogin(e) {
        e.preventDefault();
        const inputVal = document.getElementById('password-input').value.trim();
        const errorEl = document.getElementById('login-error');
        const submitBtn = document.getElementById('login-btn');

        if (!db) {
            errorEl.innerText = "❌ Lỗi: Không thể kết nối Firebase Database!";
            errorEl.style.display = 'block';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ Đang xác thực...";
        errorEl.style.display = 'none';

        try {
            // Lấy mật khẩu lưu từ node 'access_password' trên Firebase Realtime DB
            const snapshot = await db.ref('access_password').once('value');
            const realPassword = snapshot.val();

            if (realPassword !== null && String(inputVal) === String(realPassword)) {
                isAuthenticated = true;
                showDashboard();
            } else {
                errorEl.innerText = "❌ Mật khẩu không chính xác!";
                errorEl.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        } catch (err) {
            console.error("Lỗi xác thực Firebase:", err);
            errorEl.innerText = "⚠️ Không thể kiểm tra mật khẩu từ Firebase Database.";
            errorEl.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Đăng nhập";
        }
    }

    function handleLogout() {
        isAuthenticated = false;
        document.getElementById('main-dashboard').style.display = 'none';
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('password-input').value = '';
    }

    function showDashboard() {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
        updateDashboard();
    }

    // ===================================================
    // 3. CẤU HÌNH TÀI KHOẢN VÀ API
    // ===================================================
    const ACCOUNTS = [
        { name: "Cody", wallet: "0xB560DE556Cf8724aa479121139B8e7EE1Dc8447F" },
        { name: "Crystie", wallet: "0x5B842258fC785E3C8b5d17a150FB8a9Fdce26593" },
        { name: "James1", wallet: "0xa22aaf1077fc31980fb3b1900c2a27318efd6c28" },
        { name: "Kuro", wallet: "0x20d9cb64a6c5cf875897a54cf171df930d612abb" },
        { name: "Loki", wallet: "0xd985f56b366d1ea58a240b06c34a97919af168f5" },
        { name: "Momo", wallet: "0xB512f72D97a826AbB80c2258De350A9a37256BB7" },
        { name: "Omi", wallet: "0x837b6e39f119c438e61316782100b269e4b4f3a0" },
        { name: "Pokemon", wallet: "0xcee118fb6b827a5ce2eb61cca321e516fdccafdb" },
        { name: "Randy", wallet: "0x7ca6b3a5d9ec0ba2ba00298aa67b768d9bbf7e01" },
        { name: "Shiro", wallet: "0x641146919c8c720cc9f556cbb4f7f5e9d3e2dd73" },
        { name: "Nezuko", wallet: "0x3E57FcF62E7655770cA45bc3Aabf5344d9560c65" },
    ];

    const REAL_API = "https://axie-proxy.vuthanhtunghp1995.workers.dev";

    function getMostRecent1001AMMilestone() {
        const now = new Date();
        const milestone = new Date(now);
        milestone.setHours(10, 1, 0, 0); 
        if (now < milestone) {
            milestone.setDate(milestone.getDate() - 1);
        }
        return milestone.getTime();
    }

    function findWalletDeep(obj, targetWallet) {
        if (!obj || typeof obj !== 'object') return null;
        if (obj.user && String(obj.user).toLowerCase() === targetWallet.toLowerCase()) return obj;
        for (let key in obj) {
            if (obj.hasOwnProperty(key)) {
                const found = findWalletDeep(obj[key], targetWallet);
                if (found) return found;
            }
        }
        return null;
    }

    async function fetchRawDataWithFallback() {
        try {
            console.log("📡 Đang tải dữ liệu từ Cloudflare Worker...");
            const response = await fetch(REAL_API, { cache: "no-store" });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            console.log("✅ Lấy dữ liệu thành công!");
            return data;
        } catch (err) {
            console.error("❌ Lỗi kết nối Cloudflare Worker:", err.message);
            return null;
        }
    }

    async function processAccount(acc, cachedRawData, currentMilestone) {
        const walletLower = acc.wallet.toLowerCase();
        const playerData = findWalletDeep(cachedRawData, acc.wallet);

        if (!playerData) {
            return {
                html: `
                    <div class="account-block" style="border-color: var(--danger); text-align: center;">
                        <div class="account-title" style="color: var(--danger)">Tài khoản: ${acc.name}</div>
                        <div class="account-wallet">${acc.wallet}</div>
                        <div style="font-weight: bold; margin-top: 1rem; color: var(--danger)">❌ Ví chưa có dữ liệu trên API này</div>
                    </div>
                `,
                isLazy: false,
                name: acc.name
            };
        }

        const rank = playerData.rank || "N/A";
        const bountyPoint = parseInt(playerData.score, 10) || 0; 

        let prevScore = bountyPoint;
        let baselineScore = bountyPoint;
        let firebaseSuccess = false;

        if (db) {
            try {
                const dbRef = db.ref('bounty_tracker/' + walletLower);
                const snapshot = await dbRef.once('value');
                const dbData = snapshot.val();

                if (dbData) {
                    const dbMilestone = dbData.currentMilestone || 0;
                    prevScore = dbData.lastScore !== undefined ? dbData.lastScore : bountyPoint;
                    baselineScore = dbData.baselineScore !== undefined ? dbData.baselineScore : bountyPoint;

                    if (dbMilestone !== currentMilestone) {
                        baselineScore = prevScore;
                    }
                }

                await dbRef.update({
                    currentMilestone: currentMilestone,
                    lastScore: bountyPoint,
                    baselineScore: baselineScore
                });
                
                firebaseSuccess = true;
            } catch (dbError) {
                console.error("Lỗi Realtime DB cho ví: " + walletLower, dbError);
            }
        }

        const todayDiff = bountyPoint - baselineScore;
        const isLazy = todayDiff <= 0;

        let todayText = `<span class="diff-line" style="color: var(--text-sub);">🌞 Hôm nay: +0</span>`;
        if (todayDiff > 0) {
            todayText = `<span class="diff-line" style="color: var(--warning); font-weight: bold;">🌞 Hôm nay: +${todayDiff}</span>`;
        }

        const cloudBadge = firebaseSuccess 
            ? `<span style="color: var(--success); font-size: 0.75rem; font-weight: normal;">☁️ Đã đồng bộ</span>`
            : `<span style="color: var(--danger); font-size: 0.75rem; font-weight: normal;">⚠️ Lỗi Cloud</span>`;

        const html = `
            <div class="account-block ${isLazy ? 'lazy-alert' : ''}">
                <div class="account-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Tài khoản: ${acc.name} ${isLazy ? '⚠️' : ''}</span>
                    ${cloudBadge}
                </div>
                <div class="account-wallet">${acc.wallet}</div>
                
                <div class="stats-subgrid">
                    <div class="card">
                        <h3>Thứ hạng (Rank)</h3>
                        <div class="value">#${rank}</div>
                    </div>
                    <div class="card highlight" style="${isLazy ? 'border-color: var(--danger);' : ''}">
                        <h3>Bounty Point</h3>
                        <div class="value" style="color: ${isLazy ? 'var(--danger)' : 'var(--accent)'};">${bountyPoint}</div>
                        <div class="diff-container">
                            ${todayText}
                        </div>
                    </div>
                </div>
            </div>
        `;

        return { html, isLazy, name: acc.name };
    }

    async function updateDashboard() {
        if (!isAuthenticated) return;

        const refreshBtn = document.getElementById('refresh-btn');
        refreshBtn.disabled = true;
        refreshBtn.style.opacity = '0.5';

        document.getElementById('loading-state').style.display = 'block';
        document.getElementById('error-state').style.display = 'none';
        document.getElementById('warning-banner').style.display = 'none';
        document.getElementById('update-status').innerText = "Đang kết nối API Cloudflare Worker và đồng bộ dữ liệu...";
        
        const cachedRawData = await fetchRawDataWithFallback();
        if (!cachedRawData) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
            document.getElementById('error-state').innerText = "❌ Lỗi: Không thể tải dữ liệu từ Cloudflare Worker. Bấm làm mới để thử lại.";
            document.getElementById('update-status').innerText = "Cập nhật thất bại";
            refreshBtn.disabled = false;
            refreshBtn.style.opacity = '1';
            return;
        }

        const currentMilestone = getMostRecent1001AMMilestone();
        
        const results = await Promise.all(
            ACCOUNTS.map(acc => processAccount(acc, cachedRawData, currentMilestone))
        );

        let finalHtml = '';
        let idleAccounts = [];

        results.forEach(res => {
            finalHtml += res.html;
            if (res.isLazy) {
                idleAccounts.push(res.name);
            }
        });

        document.getElementById('accounts-container').innerHTML = finalHtml;

        const banner = document.getElementById('warning-banner');
        if (idleAccounts.length > 0) {
            banner.innerHTML = `⚠️ <strong>Cảnh báo hôm nay:</strong> Tài khoản [ <span style="color: #fff; font-weight: bold;">${idleAccounts.join(', ')}</span> ] chưa cày điểm trong hôm nay! (Tính từ mốc 10:01 sáng)`;
            banner.style.display = 'block';
        } else {
            banner.style.display = 'none';
        }

        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('update-status').innerText = "Đã cập nhật dữ liệu thành công ✓ (" + new Date().toLocaleTimeString() + ")";

        refreshBtn.disabled = false;
        refreshBtn.style.opacity = '1';
    }

    document.getElementById('refresh-btn').addEventListener('click', updateDashboard);
</script>

</body>
</html>
